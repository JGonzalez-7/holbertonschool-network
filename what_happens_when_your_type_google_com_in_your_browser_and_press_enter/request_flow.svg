<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1640" viewBox="0 0 1200 1640" role="img" aria-labelledby="title description">
  <title id="title">HTTPS request flow from a browser to a web application</title>
  <desc id="description">A diagram showing DNS resolution, TCP port 443, firewall filtering, TLS encryption, load balancing, a web server, an application server, a database, and the response returning to the browser.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f9ff"/>
      <stop offset="100%" stop-color="#eef7f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183153" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#315b7d"/>
    </marker>
    <style>
      .title { font: 700 36px Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 400 19px Arial, sans-serif; fill: #4b6478; }
      .box { stroke-width: 2.5; rx: 18; filter: url(#shadow); }
      .heading { font: 700 23px Arial, sans-serif; fill: #17324d; text-anchor: middle; }
      .body { font: 400 17px Arial, sans-serif; fill: #29465b; text-anchor: middle; }
      .label { font: 700 15px Arial, sans-serif; fill: #315b7d; text-anchor: middle; }
      .arrow { fill: none; stroke: #315b7d; stroke-width: 4; marker-end: url(#arrow); }
      .return { fill: none; stroke: #247764; stroke-width: 4; stroke-dasharray: 11 9; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="1640" fill="url(#background)"/>
  <text x="600" y="58" class="title" text-anchor="middle">What Happens When You Press Enter?</text>
  <text x="600" y="92" class="subtitle" text-anchor="middle">Request flow for https://www.google.com</text>

  <rect class="box" x="350" y="130" width="500" height="105" fill="#ffffff" stroke="#5c7cfa"/>
  <text x="600" y="172" class="heading">1. Browser</text>
  <text x="600" y="204" class="body">Parses the URL and checks local caches</text>

  <path class="arrow" d="M 600 235 L 600 285"/>
  <text x="685" y="270" class="label">Find the destination</text>

  <rect class="box" x="245" y="290" width="710" height="125" fill="#eef3ff" stroke="#5c7cfa"/>
  <text x="600" y="332" class="heading">2. DNS Resolution</text>
  <text x="600" y="365" class="body">Browser/cache -> recursive resolver -> root -> .com</text>
  <text x="600" y="393" class="body">-> google.com authoritative DNS -> IP address</text>

  <path class="arrow" d="M 600 415 L 600 465"/>
  <text x="727" y="450" class="label">Connect to server IP</text>

  <rect class="box" x="245" y="470" width="710" height="125" fill="#fff8e8" stroke="#e7a33e"/>
  <text x="600" y="512" class="heading">3. TCP/IP Connection</text>
  <text x="600" y="545" class="body">IP routes packets to the server; TCP performs</text>
  <text x="600" y="573" class="body">SYN -> SYN-ACK -> ACK on destination port 443</text>

  <path class="arrow" d="M 600 595 L 600 645"/>
  <text x="718" y="630" class="label">Apply access rules</text>

  <rect class="box" x="300" y="650" width="600" height="105" fill="#fff0f0" stroke="#dc5b64"/>
  <text x="600" y="692" class="heading">4. Firewall</text>
  <text x="600" y="724" class="body">Allows authorized HTTPS traffic on port 443</text>

  <path class="arrow" d="M 600 755 L 600 805"/>
  <text x="724" y="790" class="label">Secure the connection</text>

  <rect class="box" x="245" y="810" width="710" height="125" fill="#ecfbf6" stroke="#2b9b78"/>
  <text x="600" y="852" class="heading">5. HTTPS / TLS</text>
  <text x="600" y="885" class="body">Certificate validation and key agreement</text>
  <text x="600" y="913" class="body">produce an encrypted and authenticated request</text>

  <path class="arrow" d="M 600 935 L 600 985"/>
  <text x="725" y="970" class="label">Distribute the request</text>

  <path class="box" d="M 600 990 L 815 1065 L 600 1140 L 385 1065 z" fill="#f5efff" stroke="#805ad5"/>
  <text x="600" y="1058" class="heading">6. Load Balancer</text>
  <text x="600" y="1088" class="body">Chooses a healthy backend</text>

  <rect class="box" x="70" y="1195" width="300" height="130" fill="#edf7ff" stroke="#3889c9"/>
  <text x="220" y="1240" class="heading">7. Web Server</text>
  <text x="220" y="1273" class="body">Handles HTTP and</text>
  <text x="220" y="1301" class="body">serves static files</text>

  <rect class="box" x="450" y="1195" width="300" height="130" fill="#fff5e9" stroke="#dd8b2f"/>
  <text x="600" y="1240" class="heading">8. Application Server</text>
  <text x="600" y="1273" class="body">Runs business logic and</text>
  <text x="600" y="1301" class="body">generates the page</text>

  <rect class="box" x="830" y="1195" width="300" height="130" fill="#f0f8ef" stroke="#5b995b"/>
  <text x="980" y="1240" class="heading">9. Database</text>
  <text x="980" y="1273" class="body">Reads or writes</text>
  <text x="980" y="1301" class="body">persistent data</text>

  <path class="arrow" d="M 585 1140 C 500 1160, 350 1170, 245 1195"/>
  <path class="arrow" d="M 370 1260 L 445 1260"/>
  <text x="408" y="1245" class="label">Dynamic</text>
  <path class="arrow" d="M 750 1260 L 825 1260"/>
  <text x="788" y="1245" class="label">Query</text>
  <path class="return" d="M 830 1300 C 785 1350, 735 1350, 690 1328"/>
  <text x="760" y="1370" class="label">Data result</text>

  <path class="return" d="M 525 1325 C 440 1410, 285 1390, 220 1330"/>
  <path class="return" d="M 220 1325 C 220 1480, 600 1490, 600 1530"/>

  <rect class="box" x="300" y="1530" width="600" height="85" fill="#eaf9f5" stroke="#2b9b78"/>
  <text x="600" y="1567" class="heading">10. Encrypted Response</text>
  <text x="600" y="1596" class="body">The browser decrypts, parses, and renders the page</text>

  <text x="1050" y="1450" class="label" fill="#247764">Dashed arrows: response path</text>
</svg>
